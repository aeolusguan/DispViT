defaults:
  - default
  - _self_

exp_name: dispvit_syn_${model.encoder_type}_g${model.groups}
val_epoch_freq: 1

data:
  train:
    _target_: training.data.dataloader.DataLoader
    dataset:
      _target_: training.data.datasets.build_train_dataset
      crop_size: [[336, 896], [392, 784], [448, 672]]
      spatial_scale: [-0.2, 0.4]
      yjitter: False
      saturation_range: [0, 1.4]
      img_gamma: null
      do_flip: False
      datasets:
        - 'fsd * 1'
        - 'sceneflow * 1'
        - 'tartan_air * 1'
        - 'crestereo * 1'
        - 'falling_things * 1'
        - 'sintel_stereo * 1'
        - 'in_stereo2k * 1'
        - 'carla_highres * 1'
        - 'vkitti2 * 1'
        - 'irs * 1'
        - 'unrealstereo4k * 1'
        - 'wmgstereo * 1'
        - 'spring * 1'
    batch_size: 32
  val_datasets:
    - kitti_2012_training_all: null
    - kitti_2015_training_all: null
    - eth3d_all: null
    - middlebury_Q_all: 1000

model:
  _target_: dispvit.models.dispvit.DispViT
  encoder_type: vitg
  groups: 8

max_epochs: 5

checkpoint:
  save_freq: 10
  resume_checkpoint_path: null
  no_resume_optimizer: True

loss:
  disp:
    max_disp: 256
