defaults:
  - default
  - _self_

exp_name: dispvit_plus_syn_${model.regressor.model_kwargs.encoder_type}

data:
  train:
    dataset:
      datasets:
        - 'fsd * 1'
        - 'sceneflow * 1'
        - 'tartan_air * 1'
        - 'crestereo * 1'
        - 'falling_things * 1'
        - 'sintel_stereo * 1'
        - 'in_stereo2k * 1'
        - 'carla_highres * 1'
        - 'vkitti2 * 1'
        - 'irs * 1'
        - 'unrealstereo4k * 1'
        - 'wmgstereo * 1'
        - 'spring * 1'
    batch_size: 32
  val_datasets:
    - kitti_2012_training_nonocc: null
    - kitti_2015_training_nonocc: null
    - eth3d_nonocc: null
    - middlebury_Q_nonocc: 1000

model:
  _target_: dispvit.models.dispvit_plus.DispViTPlus
  regressor:
    _target_: dispvit.models.dispvit.DispViT.from_pretrained
    pretrained_model_name_or_path: aeolusguan/dispvit-vitg
    model_kwargs:
      encoder_type: vitg
      groups: 8
  extractor:
    _target_: dispvit.models.extractor.ConvNextExtractor
    output_dim: 256
    stochastic_depth_prob: 0.0
    _init_weights: True
  embed_dim: 256
  num_blocks: 6
  window_size: 6
  num_heads: 4
  mlp_ratio: 4
  drop: 0
  attn_drop: 0
  drop_path: 0
  return_intermediate: True

max_epochs: 5

loss:
  _target_: training.loss.RefineLoss
  disp:
    weight: [0.7, 0.7, 0.8, 0.8, 1.0, 1.0]
    max_disp: 256
  loss_type: l1

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_disp

optim:
  amp:
    enabled: False

  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-7
              end_value: 5e-4
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 5e-4
              end_value: 1e-7
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.00001

  gradient_clip:
    _target_: training.train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["extractor", "concatconv", "ffn", "gw"]
        max_norm: 1.0  # feel free to reduce this if see instabilities
        norm_type: 2
      - module_name: ["head"]
        max_norm: 1.0  # feel free to reduce this if see instabilities
        norm_type: 2
      - module_name: ["norm", "blocks"]
        max_norm: 1.0  # feel free to reduce this if see instabilities
        norm_type: 2

checkpoint:
  save_freq: 10  # > max_epochs to prevent intermediate checkpoints
